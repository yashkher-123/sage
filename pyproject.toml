[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-explainer"
version = "0.1.0"
description = "Sensitivity Analysis with Gradient Estimation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Yash Kher", email = "yashpkher@gmail.com" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.2",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/yashkher-123/sage"

[tool.setuptools.packages.find]
where = ["."]